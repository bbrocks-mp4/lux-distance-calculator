<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculadora — Lux × Distância</title>
  <style>
    :root{
      --bg:#f7f7f8;
      --card:#ffffff;
      --accent:#0f766e;
      --accent-soft:rgba(15,118,110,0.12);
      --text:#0f172a;
      --muted:#6b7280;
      --radius:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;transition:background-color .7s ease,color .7s ease;display:flex;justify-content:center;align-items:center}
    .wrap{width:100%;max-width:720px;position:relative;margin:0 auto}

    /* Theme switcher (compact) */
    .theme-switcher{position:fixed;bottom:20px;left:20px;background:var(--card);border-radius:12px;padding:6px;box-shadow:0 8px 26px rgba(0,0,0,0.12);display:flex;gap:8px;z-index:60;align-items:center;overflow:hidden;width:46px;transition:width .28s cubic-bezier(.2,.9,.2,1),box-shadow .28s ease}
    .theme-switcher.expanded{box-shadow:0 18px 46px rgba(0,0,0,0.12)}
    .theme-btn{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 2px 6px rgba(0,0,0,0.06);flex:0 0 36px;transition:transform .12s ease,opacity .18s ease,border-color .18s ease}
    .theme-btn:not(:first-child){opacity:0;transform:translateX(-6px);pointer-events:none}
    .theme-switcher.expanded .theme-btn{opacity:1;transform:translateX(0);pointer-events:auto}

    .lang-toggle{position:fixed;bottom:20px;right:20px;background:var(--card);border-radius:12px;padding:6px;box-shadow:0 8px 26px rgba(0,0,0,0.12);z-index:60}
    .lang-toggle button{border:none;background:transparent;cursor:pointer;padding:6px;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;width:44px;height:44px}
    .lang-panel{position:absolute;bottom:58px;right:0;background:var(--card);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,0.12);display:none;min-width:200px;transform:translateX(-10px)}
    .lang-panel button{display:block;width:100%;text-align:left;padding:8px 10px;border:none;background:transparent;cursor:pointer;border-radius:6px;font-size:14px;border-bottom:1px solid #eef2f5}
    .lang-panel button:last-child{border-bottom:none}

    .card{background:var(--card);padding:28px;border-radius:14px;box-shadow:0 12px 36px rgba(6,10,14,0.08);transition:background-color .7s ease,box-shadow .7s ease;width:100%}
    h1{font-size:30px;font-weight:700;text-align:center;margin-bottom:6px}
    .subtitle{text-align:center;font-size:14px;color:var(--muted);margin-bottom:18px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;margin-top:10px}
    input[type=number]{width:100%;padding:12px;border-radius:10px;border:1px solid #e6e9ee;font-size:15px}
    input[type=range]{width:100%;margin-top:8px}
    .result-box{background:var(--accent-soft);border-radius:12px;padding:22px;margin-top:18px;text-align:center}
    .result-title{font-size:13px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
    .result-value{margin-top:6px;font-size:46px;font-weight:700;color:var(--accent)}
    table{width:100%;border-collapse:collapse;margin-top:22px;font-size:20px}
    th{text-align:left;color:var(--muted);font-weight:600;padding-bottom:8px}
    td{padding:10px 0;border-bottom:1px solid #f1f1f1}

    .table-controls{display:flex;gap:10px;align-items:center;margin-top:12px}
    .btn{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;background:#eef2f5;color:var(--text)}
    .btn.primary{background:var(--accent);color:white}
    .btn.ghost{background:transparent;border:1px solid #e6e9ee}

    @media (max-width:480px){
      body{align-items:flex-start;padding:12px}
      .wrap{max-width:420px}
      h1{font-size:22px}
      .result-value{font-size:36px}
      .theme-switcher{left:10px;bottom:12px}
      .lang-toggle{right:10px;bottom:12px}
      .theme-btn{width:34px;height:34px}
      .lang-panel{min-width:160px}
      table{font-size:22px}
    }
  </style>
</head>
<body>

  <!-- Theme switcher (compact) -->
  <div class="theme-switcher" id="themeSwitcher" aria-hidden="false">
    <button class="theme-btn" data-theme="cinematicCool" style="background:#4a708b" title="Cinematic Cool"></button>
    <button class="theme-btn" data-theme="cinematicWarm" style="background:#b87333" title="Cinematic Warm"></button>
    <button class="theme-btn" data-theme="steel" style="background:#7e858e" title="Steel"></button>
    <button class="theme-btn" data-theme="tungsten" style="background:#ff8c3a" title="Tungsten"></button>
    <button class="theme-btn" data-theme="minimalLight" style="background:#ffffff;border:1px solid #ddd" title="Minimal Light"></button>
    <button class="theme-btn" data-theme="green" style="background:#0f766e" title="Green"></button>
  </div>

  <!-- Language selector -->
  <div class="lang-toggle">
    <button id="langBtn" title="Language">🌍</button>
    <div class="lang-panel" id="langPanel" role="menu" aria-hidden="true"></div>
  </div>

  <div class="wrap">
    <section class="card">
      <h1 id="title">Lux × Distância</h1>
      <p class="subtitle" id="subtitle">Informe o lux base e a distância base. A calculadora estimará o lux em outras distâncias.</p>

      <label for="lux" id="luxLabel">Iluminância base (lux)</label>
      <input id="lux" type="number" value="300" step="0.1" min="0">

      <label for="dbase" id="dbaseLabel">Distância base (m)</label>
      <input id="dbase" type="number" value="1" step="0.01" min="0.01">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;">
        <label for="dnew" id="dnewLabel" style="margin:0;">Distância variável (m)</label>
        <div class="small" id="currentText" style="margin-left:8px;white-space:nowrap;">Atual: <strong id="dnewVal">1.00 m</strong></div>
      </div>
      <input id="dnew" type="range" min="0" max="1" step="0.001" value="0">

      <div class="result-box">
        <div class="result-title" id="resultTitle">Iluminância estimada</div>
        <div class="result-value"><span id="luxResult">300</span> lux</div>
      </div>

      <table>
        <thead>
          <tr><th id="thDist">Distância</th><th id="thLux">Lux</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>

      <div class="table-controls" style="justify-content:flex-end;">
        <button id="editTableBtn" class="btn">Editar tabela</button>
        <div id="editActions" style="display:none">
          <button id="saveTableBtn" class="btn primary">Salvar</button>
          <button id="cancelTableBtn" class="btn ghost">Cancelar</button>
        </div>
      </div>

      <!-- STOPS CONTROL -->
      <div style="margin-top:22px;padding-top:18px;display:flex;flex-direction:column;gap:16px;background:var(--accent-soft);border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,0.08);padding:18px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div id="stopsLabel" style="font-size:13px;color:var(--muted);font-weight:600">Stops</div>
          <div style="display:flex;align-items:center;gap:8px;background:var(--card);padding:6px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.04)">
            <button id="stopsMinus" class="btn" aria-label="Diminuir">-</button>
            <div style="min-width:54px;text-align:center;font-weight:700" id="stopsValue">0.0</div>
            <button id="stopsPlus" class="btn" aria-label="Aumentar">+</button>
          </div>
          <div id="stopsHelper" style="margin-left:12px;color:var(--muted);font-size:13px">(0.0 to 5.0 — stepping 0.5)</div>
        </div>

        <div>
          <div id="adjTitle" style="font-size:14px;font-weight:600;margin-bottom:8px">Adjusted Diffusion</div>
          <table>
            <thead><tr><th id="adjThDist">Distância</th><th id="adjThLux">Lux </th></tr></thead>
            <tbody id="adjTableBody"></tbody>
          </table>
        </div>
      </div>

    </section>
  </div>

  <script>
  // core math
  function computeLux(Ebase, dbase, dnew){ return Ebase * (dbase*dbase) / (dnew*dnew); }
  const luxInput = document.getElementById('lux');
  const dbaseInput = document.getElementById('dbase');
  const dnewRange = document.getElementById('dnew');
  const dMin = 0.5, dMax = 50;
  function curveToDist(t){ const R = dMax/dMin; const p = 0.45; return dMin * Math.pow(R, Math.pow(t, p)); }
  function distToCurve(d){ const R = dMax/dMin; const p = 0.45; const base = Math.log(d/dMin)/Math.log(R); return Math.pow(base, 1/p); }
  // note: dnewVal element can be recreated when changing language, so we don't cache it here.
  const luxResultEl = document.getElementById('luxResult');
  const tableBody = document.getElementById('tableBody');
  let sampleDistances = [1,2,3,5,10,15,20,30,50];
  let editMode = false;
  let tempDistances = [];

  function fmt(n){ const v = Number(n).toFixed(0); return v.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

  function renderTable(){
    const Ebase = parseFloat(luxInput.value)||0;
    const dbase = parseFloat(dbaseInput.value)||1;
    tableBody.innerHTML = '';

    sampleDistances.forEach((d, idx)=>{
      const val = computeLux(Ebase, dbase, d);
      const tr = document.createElement('tr');
      const td1 = document.createElement('td');

      if(editMode){
        const input = document.createElement('input');
        input.type = 'number';
        input.value = d;
        input.step = '0.01';
        input.min = '0.01';
        input.style.width = '120px';
        input.dataset.idx = idx;
        td1.appendChild(input);
      } else {
        td1.textContent = d<1 ? (d*100).toFixed(0)+' cm' : (d<5 ? Math.round(d)+' m' : (d<10 ? d.toFixed(1)+' m' : d.toFixed(1)+' m'));
      }

      const td2 = document.createElement('td');
      td2.textContent = fmt(val) + ' lux';
      tr.appendChild(td1); tr.appendChild(td2); tableBody.appendChild(tr);
    });
  }

  // ADJUSTED TABLE (stops)
  const adjTableBody = document.getElementById('adjTableBody');
  let stops = 0.0; // in stops, range 0.0 .. 3.0 step 0.5

  function renderAdjustedTable(){
    const Ebase = parseFloat(luxInput.value)||0;
    const dbase = parseFloat(dbaseInput.value)||1;
    adjTableBody.innerHTML = '';
    sampleDistances.forEach(d=>{
      const baseVal = computeLux(Ebase, dbase, d);
      const adjusted = baseVal * Math.pow(2, -stops); // each stop halves light
      const tr = document.createElement('tr');
      const td1 = document.createElement('td');
      td1.textContent = d<1 ? (d*100).toFixed(0)+' cm' : (d<5 ? Math.round(d)+' m' : (d<10 ? d.toFixed(1)+' m' : d.toFixed(1)+' m'));
      const td2 = document.createElement('td');
      td2.textContent = fmt(adjusted) + ' lux';
      tr.appendChild(td1); tr.appendChild(td2); adjTableBody.appendChild(tr);
    });
  }

  // stops controls
  const stopsMinus = document.getElementById('stopsMinus');
  const stopsPlus = document.getElementById('stopsPlus');
  const stopsValueEl = document.getElementById('stopsValue');
  function setStops(v){
    stops = Math.round(v*2)/2; // ensure 0.5 increments
    if(stops < 0) stops = 0;
    if(stops > 5) stops = 5;
    stopsValueEl.textContent = stops.toFixed(1);
    stopsMinus.disabled = stops <= 0;
    stopsPlus.disabled = stops >= 5;
    renderAdjustedTable();
  }
  stopsMinus.addEventListener('click', ()=> setStops(Math.max(0, stops - 0.5)));
  stopsPlus.addEventListener('click', ()=> setStops(Math.min(5, stops + 0.5)));

  // initialize adjusted table
  setStops(0.0);

function update(){
    const Ebase = parseFloat(luxInput.value)||0;
    const dbase = parseFloat(dbaseInput.value)||1;
    const dnew = curveToDist(parseFloat(dnewRange.value));
    const Enew = computeLux(Ebase, dbase, dnew);
    luxResultEl.textContent = fmt(Enew);
    (function(){ const el = document.getElementById('dnewVal'); if(el) el.textContent = dnew<1 ? (dnew*100).toFixed(0)+' cm' : (dnew<5 ? dnew.toFixed(2)+' m' : (dnew<10 ? dnew.toFixed(1)+' m' : dnew.toFixed(1)+' m')); })();
    renderTable();
    renderAdjustedTable();
  }

  // edit controls
  const editTableBtn = document.getElementById('editTableBtn');
  const editActions = document.getElementById('editActions');
  const saveTableBtn = document.getElementById('saveTableBtn');
  const cancelTableBtn = document.getElementById('cancelTableBtn');

  editTableBtn.addEventListener('click', ()=>{
    editMode = true;
    tempDistances = sampleDistances.slice();
    editTableBtn.style.display = 'none';
    editActions.style.display = 'flex';
    renderTable();
  });

  cancelTableBtn.addEventListener('click', ()=>{
    editMode = false;
    tempDistances = [];
    editTableBtn.style.display = 'inline-block';
    editActions.style.display = 'none';
    renderTable();
  });

  saveTableBtn.addEventListener('click', ()=>{
    // collect inputs
    const inputs = tableBody.querySelectorAll('input[type=number]');
    const newDistances = [];
    for(const inp of inputs){
      const v = parseFloat(inp.value);
      if(!isFinite(v) || v <= 0){ alert('Valores de distância devem ser números positivos.'); return; }
      newDistances.push(v);
    }
    // replace sampleDistances and re-render
    sampleDistances = newDistances.slice();
    editMode = false;
    tempDistances = [];
    editTableBtn.style.display = 'inline-block';
    editActions.style.display = 'none';
    update();
  });

  luxInput.addEventListener('input', update);
  dbaseInput.addEventListener('input', update);
  dnewRange.addEventListener('input', ()=>{ update(); });

  // THEMES
  const themeSwitcher = document.getElementById('themeSwitcher');
  const themes = {
    cinematicWarm: { bg: 'linear-gradient(180deg, rgba(184,115,51,0.22), rgba(243,237,229,0.9))', card: '#ffffff', accent: '#b87333', accentSoft: 'rgba(184,115,51,0.12)', text: '#1a1a1a' },
    cinematicCool: { bg: 'linear-gradient(180deg, rgba(74,112,139,0.22), rgba(230,238,243,0.94))', card: '#ffffff', accent: '#4a708b', accentSoft: 'rgba(74,112,139,0.12)', text: '#1a1a1a' },
    steel: { bg: 'linear-gradient(180deg, rgba(126,133,142,0.22), rgba(227,229,232,0.95))', card: '#ffffff', accent: '#7e858e', accentSoft: 'rgba(126,133,142,0.14)', text: '#1a1a1a' },
    tungsten: { bg: 'linear-gradient(180deg, rgba(255,140,58,0.18), rgba(255,243,231,0.96))', card: '#ffffff', accent: '#ff8c3a', accentSoft: 'rgba(255,140,58,0.14)', text: '#1a1a1a' },
    minimalLight: { bg: 'linear-gradient(180deg, rgba(17,24,39,0.06), rgba(250,250,250,0.98))', card: '#ffffff', accent: '#111827', accentSoft: 'rgba(17,24,39,0.06)', text: '#111827' },
    green: { bg: 'linear-gradient(180deg, rgba(15,118,110,0.22), rgba(227,245,243,0.96))', card: '#ffffff', accent: '#0f766e', accentSoft: 'rgba(15,118,110,0.12)', text: '#0f172a' }
  };

  // dynamic width computation for expansion
  let themeTimeout = null;
  function computeThemeWidth(){
    const children = Array.from(themeSwitcher.children);
    let total = 12; // padding
    children.forEach((c,i)=>{
      const w = c.getBoundingClientRect().width || 36;
      total += w;
      if(i < children.length - 1) total += 8; // gap
    });
    return Math.ceil(total);
  }

  function expandThemes(){
    clearTimeout(themeTimeout);
    const w = computeThemeWidth();
    themeSwitcher.style.width = w + 'px';
    themeSwitcher.classList.add('expanded');
    themeTimeout = setTimeout(()=>{ collapseThemes(); }, 5000);
  }
  function collapseThemes(){ clearTimeout(themeTimeout); themeSwitcher.classList.remove('expanded'); themeSwitcher.style.width = '46px'; }

  themeSwitcher.addEventListener('mouseenter', expandThemes);
  themeSwitcher.addEventListener('click', (e)=>{
    if(!themeSwitcher.classList.contains('expanded')){ expandThemes(); return; }
    const btn = e.target.closest('[data-theme]');
    if(btn && btn.dataset.theme){ applyTheme(btn.dataset.theme); return; }
  });
  window.addEventListener('click',(e)=>{ if(!themeSwitcher.contains(e.target)) collapseThemes(); });

  function applyTheme(key){
    const t = themes[key]; if(!t) return;
    document.documentElement.style.setProperty('--bg', t.bg);
    document.documentElement.style.setProperty('--card', t.card);
    document.documentElement.style.setProperty('--accent', t.accent);
    document.documentElement.style.setProperty('--accent-soft', t.accentSoft);
    document.documentElement.style.setProperty('--text', t.text);

    // visual highlight
    themeSwitcher.querySelectorAll('.theme-btn').forEach(btn=> btn.style.borderColor = (btn.dataset.theme===key)?'#00000055':'transparent');

    // reorder: selected becomes first, previous first moves to end
    const buttons = Array.from(themeSwitcher.querySelectorAll('[data-theme]'));
    const first = buttons[0];
    const selected = buttons.find(b=>b.dataset.theme===key);
    if(selected && selected !== first){
      themeSwitcher.insertBefore(selected, themeSwitcher.firstChild);
      themeSwitcher.appendChild(first);
    }
  }

  // LANGUAGES
  const languages = [
    {code:'en', name:'English', native:'English'},
    {code:'zh', name:'Chinese', native:'中文'},
    {code:'hi', name:'Hindi', native:'हिन्दी'},
    {code:'es', name:'Spanish', native:'Español'},
    {code:'fr', name:'French', native:'Français'},
    {code:'ar', name:'Arabic', native:'العربية'},
    {code:'bn', name:'Bengali', native:'বাংলা'},
    {code:'ru', name:'Russian', native:'Русский'},
    {code:'pt', name:'Portuguese', native:'Português'},
    {code:'ur', name:'Urdu', native:'اردو'}
  ];
  const i18n = {
    en:{ title:'Lux × Distance', subtitle:'Real-time calculation based on the inverse-square law', luxLabel:'Illuminance (lux)', dbaseLabel:'Base distance (m)', dnewLabel:'Variable distance (m)', current:'Current:', estimated:'Estimated illuminance', distance:'Distance', tableLux:'Lux', editTable:'Edit table', save:'Save', cancel:'Cancel', stopsLabel:'Stops', adjTableTitle:'Adjusted Diffusion', stopsHelper:'(0.0 to 5.0 — stepping 0.5)', adjLuxLabel:'Lux (adjusted)', afterDiff:'after diffusion' },
    zh:{ title:'照度 × 距离', subtitle:'基于平方反比定律的实时计算', luxLabel:'照度 (lux)', dbaseLabel:'基准距离 (m)', dnewLabel:'可变距离 (m)', current:'当前:', estimated:'估计照度', distance:'距离', tableLux:'Lux', editTable:'编辑表格', save:'保存', cancel:'取消', stopsLabel:'档位', adjTableTitle:'扩散调整', stopsHelper:'(0.0 至 5.0 — 每步 0.5)', adjLuxLabel:'调整后照度', afterDiff:'扩散后' },
    hi:{ title:'लक्स × दूरी', subtitle:'इनवर्स-स्क्वायर नियम पर वास्तविक समय गणना', luxLabel:'प्रकाशता (lux)', dbaseLabel:'मूल दूरी (m)', dnewLabel:'चर दूरी (m)', current:'वर्तमान:', estimated:'अनुमानित प्रकाश', distance:'दूरी', tableLux:'Lux', editTable:'तालिका संपादित करें', save:'सेव', cancel:'रद्द', stopsLabel:'स्टॉप्स', adjTableTitle:'समायोजित डिफ्यूज़न', stopsHelper:'(0.0 से 5.0 — 0.5 स्टेप)', adjLuxLabel:'समायोजित लक्स', afterDiff:'डिफ्यूज़न के बाद' },
    es:{ title:'Lux × Distancia', subtitle:'Cálculo en tiempo real basado en la ley del inverso del cuadrado', luxLabel:'Iluminancia (lux)', dbaseLabel:'Distancia base (m)', dnewLabel:'Distancia variable (m)', current:'Actual:', estimated:'Iluminancia estimada', distance:'Distancia', tableLux:'Lux', editTable:'Editar tabla', save:'Guardar', cancel:'Cancelar', stopsLabel:'Stops', adjTableTitle:'Difusión Ajustada', stopsHelper:'(0.0 a 5.0 — pasos de 0.5)', adjLuxLabel:'Lux (ajustado)', afterDiff:'después de la difusión' },
    fr:{ title:'Lux × Distance', subtitle:'Calcul en temps réel basé sur la loi de l’inverse du carré', luxLabel:'luminance (lux)', dbaseLabel:'distance de base (m)', dnewLabel:'distance variable (m)', current:'Actuel:', estimated:'Luminance estimée', distance:'Distance', tableLux:'Lux', editTable:'Modifier le tableau', save:'Enregistrer', cancel:'Annuler', stopsLabel:'Stops', adjTableTitle:'Diffusion Ajustée', stopsHelper:'(0.0 à 5.0 — incréments de 0.5)', adjLuxLabel:'Lux (ajusté)', afterDiff:'après diffusion' },
    ar:{ title:'لوكس × المسافة', subtitle:'حساب فوري يعتمد على قانون التربيع العكسي', luxLabel:'الإضاءة (lux)', dbaseLabel:'المسافة الأساسية (م)', dnewLabel:'المسافة المتغيرة (م)', current:'الحالي:', estimated:'الإضاءة المقدرة', distance:'المسافة', tableLux:'لوكس', editTable:'تعديل الجدول', save:'حفظ', cancel:'إلغاء', stopsLabel:'التوقفات', adjTableTitle:'الانتشار المُعدَّل', stopsHelper:'(0.0 إلى 5.0 — خطوة 0.5)', adjLuxLabel:'لوكس (مُعدَّل)', afterDiff:'بعد الانتشار' },
    bn:{ title:'লাক্স × দূরত্ব', subtitle:'ইনভার্স-স্কোয়ার সূত্রের ভিত্তিতে রিয়েল-টাইম গণনা', luxLabel:'ইলুমিন্যান্স (lux)', dbaseLabel:'বেস দূরত্ব (m)', dnewLabel:'ভ্যারিয়েবল দূরত্ব (m)', current:'বর্তমান:', estimated:'আনুমানিক ইলুমিন্যান্স', distance:'দূরত্ব', tableLux:'Lux', editTable:'টেবিল সম্পাদনা', save:'সংরক্ষণ', cancel:'বাতিল', stopsLabel:'স্টপস', adjTableTitle:'সমন্বিত ডিফিউশন', stopsHelper:'(0.0 থেকে 5.0 — 0.5 স্টেপ)', adjLuxLabel:'সমন্বিত লাক্স', afterDiff:'ডিফিউশনের পরে' },

  // build language panel
  const langBtn = document.getElementById('langBtn');
  const langPanel = document.getElementById('langPanel');
  languages.forEach(l=>{
    const b = document.createElement('button');
    b.textContent = l.native + ' — ' + l.name;
    b.addEventListener('click',()=>{ applyLanguage(l.code); langPanel.style.display='none'; });
    langPanel.appendChild(b);
  });
  langBtn.addEventListener('click',()=>{ langPanel.style.display = langPanel.style.display === 'block' ? 'none' : 'block'; });

  let defaultLang = document.documentElement.lang || 'pt';
  function applyLanguage(code){ const map = i18n[code] || i18n['en']; document.documentElement.lang = code; document.getElementById('title').textContent = map.title; document.getElementById('subtitle').textContent = map.subtitle; document.getElementById('luxLabel').textContent = map.luxLabel; document.getElementById('dbaseLabel').textContent = map.dbaseLabel; document.getElementById('dnewLabel').textContent = map.dnewLabel; document.getElementById('currentText').innerHTML = (map.current || 'Current:') + ' <strong id="dnewVal">1.00 m</strong>'; document.getElementById('resultTitle').textContent = map.estimated; document.getElementById('thDist').textContent = map.distance; document.getElementById('thLux').textContent = map.tableLux;
      const adjThDist = document.getElementById('adjThDist'); if(adjThDist) adjThDist.textContent = map.distance;
      const adjThLux = document.getElementById('adjThLux'); if(adjThLux) adjThLux.textContent = map.tableLux; const editBtn = document.getElementById('editTableBtn'); if(editBtn) editBtn.textContent = map.editTable || 'Edit table'; const saveBtn = document.getElementById('saveTableBtn'); if(saveBtn) saveBtn.textContent = map.save || 'Save'; const cancelBtn = document.getElementById('cancelTableBtn'); if(cancelBtn) cancelBtn.textContent = map.cancel || 'Cancel'; const stopsLbl = document.getElementById('stopsLabel'); if(stopsLbl) stopsLbl.textContent = map.stopsLabel || 'Stops'; const adjTitle = document.getElementById('adjTitle'); if(adjTitle) adjTitle.textContent = map.adjTableTitle || 'Adjusted table (by stops)'; const stopsHelp = document.getElementById('stopsHelper'); if(stopsHelp) stopsHelp.textContent = map.stopsHelper || '(0.0 to 5.0 — stepping 0.5)'; update(); }

  // close language panel when clicking outside
  window.addEventListener('click',(e)=>{ if(!document.querySelector('.lang-toggle').contains(e.target)) langPanel.style.display='none'; });

  // init
  applyLanguage(defaultLang);
  update();
  </script>
